name: Build GymFit Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Prepare app assets
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp adaptive-icon.png assets/adaptive-icon.png
          echo "Assets prepared:"
          ls -la assets

      - name: Check Expo project
        run: npx expo-doctor
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL
        run: |
          BUILD_URL=$(eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive | jq -r '.[0].artifacts.buildUrl')

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "APK URL not found"
            exit 1
          fi

          echo "BUILD_URL=$BUILD_URL" >> "$GITHUB_ENV"

      - name: Download APK
        run: |
          curl -L "$BUILD_URL" -o GymFit.apk
          ls -lh GymFit.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymFit-APK
          path: GymFit.apk
          retention-days: 30
